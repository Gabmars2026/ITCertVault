<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06101d"><title>AI News Now — Everything AI, One Place</title><meta name="description" content="Latest AI news with automatically updated headlines and images."><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2307111f'/><text x='8' y='44' font-size='34' font-weight='800' fill='%23258cff'>AI</text></svg>"><style>
:root{--bg:#06101d;--panel:#0c1a2b;--line:#1a3048;--text:#f6f9fd;--muted:#8ea1b6;--blue:#268cff;--green:#43d39a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#11304f 0,#06101d 42%,#040b13 100%);color:var(--text);font:14px Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.top{max-width:1500px;margin:auto;padding:18px 26px;display:grid;grid-template-columns:auto minmax(260px,520px) auto;gap:24px;align-items:center}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#268cff);font-weight:900;font-size:20px}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.search{display:flex;height:44px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#0a1828}.search input{flex:1;border:0;outline:0;background:transparent;color:#fff;padding:0 14px}.search button{width:48px;border:0;background:transparent;color:#b8c8d9;cursor:pointer}.cta{padding:11px 16px;border-radius:10px;background:linear-gradient(135deg,#6d56ff,#1b82f2);font-weight:800}.nav{position:sticky;top:0;z-index:20;background:rgba(5,14,24,.92);border-block:1px solid var(--line);backdrop-filter:blur(12px)}.nav div{max-width:1500px;margin:auto;padding:0 18px;display:flex;overflow:auto;scrollbar-width:none}.nav a{padding:15px 12px;white-space:nowrap;font-size:11px;font-weight:800;color:#92a5ba;border-bottom:2px solid transparent}.nav a.active,.nav a:hover{color:#fff;border-color:var(--blue)}main{max-width:1500px;margin:auto;padding:22px 26px 48px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px}.hero{position:relative;height:500px;overflow:hidden;border:1px solid var(--line);border-radius:19px;background:#07131f;box-shadow:0 24px 55px #0007}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#020812f2 0,#04101dcc 42%,#04101d33 72%,#04101d77),linear-gradient(0deg,#020812cc,transparent 55%)}.copy{position:relative;z-index:2;width:min(690px,74%);padding:72px}.tag{font-size:11px;font-weight:900;color:#65b2ff;letter-spacing:.07em}.copy h1{font-size:clamp(34px,4vw,60px);line-height:1.02;letter-spacing:-.045em;margin:13px 0 17px}.copy p{color:#c2ceda;line-height:1.65;font-size:15px;max-width:600px}.meta{color:#a8bbce;font-size:12px}.meta b{color:var(--green)}.read{display:inline-block;margin-top:20px;font-weight:800}.arrow{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:58px;height:58px;border-radius:50%;border:1px solid #ffffff33;background:#071524db;color:#fff;font-size:34px;cursor:pointer;box-shadow:0 10px 28px #0008;transition:.18s}.arrow:hover{background:#187fe9;transform:translateY(-50%) scale(1.07)}.arrow:active{transform:translateY(-50%) scale(.95)}.arrow:focus-visible{outline:3px solid white;outline-offset:3px}.prev{left:18px}.next{right:18px}.dots{position:absolute;z-index:6;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px}.dot{border:0;padding:0;width:9px;height:9px;border-radius:99px;background:#ffffff66;cursor:pointer}.dot.on{width:29px;background:var(--blue)}.head{display:flex;justify-content:space-between;align-items:center;margin:27px 0 13px}.head h2{font-size:17px;margin:0}.head a{font-size:11px;color:#82b7eb}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);background:linear-gradient(#0d1e31,#091624);border-radius:13px;overflow:hidden;transition:.18s}.card:hover{border-color:#31567c;transform:translateY(-2px)}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0a1623}.body{padding:13px}.label{font-size:9px;color:#63b0ff;font-weight:900;text-transform:uppercase}.card h3{font-size:15px;line-height:1.38;margin:7px 0}.card p{font-size:11px;line-height:1.55;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.side{display:flex;flex-direction:column;gap:14px}.box{border:1px solid var(--line);border-radius:14px;padding:17px;background:linear-gradient(#0e2035,#091625)}.brief{background:radial-gradient(circle at 90% 5%,#5947ff55,transparent 40%),linear-gradient(#10243d,#091625)}.box h3{margin:0 0 10px}.brief h3{font-size:22px}.box p{color:var(--muted);font-size:11px;line-height:1.6}.brief a{display:inline-block;padding:9px 12px;background:#197eef;border-radius:9px;font-size:11px;font-weight:800}.pop{display:grid;grid-template-columns:25px 64px 1fr;gap:9px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.pop:first-of-type{border-top:0}.num{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#176fcf;font-size:10px;font-weight:900}.pop img{width:64px;height:43px;border-radius:6px;object-fit:cover}.pop b{font-size:10px;line-height:1.35;display:block}.pop span{font-size:9px;color:#7b90a7}.route h1{font-size:34px;margin:6px 0}.route p{color:var(--muted)}.empty,.loading,.error{border:1px solid var(--line);border-radius:15px;padding:40px;text-align:center;background:var(--panel);color:var(--muted)}footer{max-width:1500px;margin:auto;border-top:1px solid var(--line);padding:25px 26px 36px;color:#71869d;font-size:10px;display:flex;justify-content:space-between}footer b{color:#c5d4e2}@media(max-width:1100px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:720px){.top{grid-template-columns:1fr auto;padding:14px}.search{grid-column:1/-1}.cta{display:none}main{padding:13px}.hero{height:530px}.copy{width:100%;padding:90px 48px 70px}.copy h1{font-size:34px}.arrow{width:44px;height:44px;font-size:28px}.prev{left:7px}.next{right:7px}.grid,.side{grid-template-columns:1fr}.brand small{display:none}}
</style></head><body><header class="top"><a href="/" class="brand"><span class="logo">AI</span><span><b>AI NEWS NOW</b><small>Your Daily Source for Everything AI</small></span></a><form id="search" class="search"><input id="q" placeholder="Search AI news, tools, models..." aria-label="Search AI news"><button aria-label="Search">⌕</button></form><a class="cta" href="/all-news/">Explore News</a></header><nav class="nav"><div><a href="/" data-k="home">HOME</a><a href="/breaking/" data-k="breaking">BREAKING</a><a href="/chatgpt/" data-k="chatgpt">CHATGPT</a><a href="/claude/" data-k="claude">CLAUDE</a><a href="/gemini/" data-k="gemini">GEMINI</a><a href="/ai-models/" data-k="models">AI MODELS</a><a href="/ai-video/" data-k="video">AI VIDEO</a><a href="/ai-images/" data-k="images">AI IMAGES</a><a href="/coding/" data-k="coding">CODING</a><a href="/hardware/" data-k="hardware">HARDWARE</a><a href="/robotics/" data-k="robotics">ROBOTICS</a><a href="/business/" data-k="business">BUSINESS</a><a href="/all-news/" data-k="all">ALL NEWS</a></div></nav><main id="app"><div class="loading">Loading live AI news and high-quality images…</div></main><footer><span><b>AI NEWS NOW</b> · Automatically refreshed from public publisher feeds.</span><a href="/all-news/">All News</a></footer><script>
const A=document.querySelector('#app'),Q=document.querySelector('#q'),F=document.querySelector('#search');let N=[],H=[],i=0,t;const R={'/':{k:'home',n:'Latest AI News',x:[]},'/breaking/':{k:'breaking',n:'Breaking AI News',x:[]},'/chatgpt/':{k:'chatgpt',n:'ChatGPT & OpenAI',x:['chatgpt','openai','gpt']},'/claude/':{k:'claude',n:'Claude & Anthropic',x:['claude','anthropic']},'/gemini/':{k:'gemini',n:'Gemini & Google AI',x:['gemini','deepmind','google ai']},'/ai-models/':{k:'models',n:'AI Models',x:['model','llm','reasoning']},'/ai-video/':{k:'video',n:'AI Video',x:['video','sora','runway','veo']},'/ai-images/':{k:'images',n:'AI Images',x:['image','midjourney','flux','stable diffusion']},'/coding/':{k:'coding',n:'AI Coding',x:['coding','code','developer','copilot','cursor']},'/hardware/':{k:'hardware',n:'AI Hardware',x:['nvidia','gpu','chip','hardware','amd','intel']},'/robotics/':{k:'robotics',n:'AI Robotics',x:['robot','robotics','humanoid']},'/business/':{k:'business',n:'AI Business',x:['business','funding','revenue','deal','startup']},'/all-news/':{k:'all',n:'All AI News',x:[]}};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ago=d=>{let m=Math.max(1,Math.floor((Date.now()-new Date(d))/6e4));return m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'},fb='https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=1600&q=88',img=n=>/^https?:/.test(n.image||'')?n.image:fb,route=()=>R[location.pathname.endsWith('/')?location.pathname:location.pathname+'/']||R['/'];function card(n){return `<article class="card"><a href="${esc(n.link)}" target="_blank" rel="noopener"><img src="${esc(img(n))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='${fb}'"></a><div class="body"><div class="label">${esc(n.source)} · ${ago(n.published)}</div><h3><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a></h3><p>${esc(n.description||'Open the original story for full details.')}</p></div></article>`}function hero(n){return `<img src="${esc(img(n))}" alt="" referrerpolicy="no-referrer" onerror="this.src='${fb}'"><div class="shade"></div><div class="copy"><div class="tag">● LIVE AI NEWS</div><h1>${esc(n.title)}</h1><p>${esc(n.description||'The latest development in artificial intelligence.')}</p><div class="meta">${ago(n.published)} · <b>${esc(n.source)}</b></div><a class="read" href="${esc(n.link)}" target="_blank" rel="noopener">Read full story →</a></div><button class="arrow prev" aria-label="Previous headline" title="Previous headline">‹</button><button class="arrow next" aria-label="Next headline" title="Next headline">›</button><div class="dots">${H.map((_,x)=>`<button class="dot ${x===i?'on':''}" data-i="${x}" aria-label="Show headline ${x+1}"></button>`).join('')}</div>`}function bind(){let h=document.querySelector('.hero');if(!h)return;h.querySelector('.prev').onclick=()=>show(i-1,1);h.querySelector('.next').onclick=()=>show(i+1,1);h.querySelectorAll('.dot').forEach(d=>d.onclick=()=>show(+d.dataset.i,1));h.onmouseenter=stop;h.onmouseleave=start}function show(x,u){i=(x+H.length)%H.length;let h=document.querySelector('.hero');if(h){h.innerHTML=hero(H[i]);bind()}if(u){stop();start()}}function stop(){clearInterval(t)}function start(){stop();t=setInterval(()=>show(i+1),7000)}function home(){H=N.slice(0,5);i=0;let pop=N.slice(2,7);A.innerHTML=`<div class="layout"><div><section class="hero">${hero(H[0])}</section><div class="head"><h2>LATEST AI NEWS</h2><a href="/all-news/">View all →</a></div><section class="grid">${N.slice(1,10).map(card).join('')}</section></div><aside class="side"><section class="box brief"><div class="tag">${new Date().toLocaleDateString()}</div><h3>Daily AI Brief</h3><p>The newest AI headlines, model updates, business moves, hardware and research in one place.</p><a href="/all-news/">Read today's news →</a></section><section class="box"><h3>POPULAR NEWS</h3>${pop.map((n,x)=>`<a class="pop" href="${esc(n.link)}" target="_blank"><span class="num">${x+1}</span><img src="${esc(img(n))}" alt="" onerror="this.src='${fb}'"><span><b>${esc(n.title)}</b><span>${ago(n.published)}</span></span></a>`).join('')}</section></aside></div>`;bind();start()}function render(){let r=route();document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.k===r.k));if(r.k==='home')return home();stop();let L=r.k==='breaking'?N.slice(0,20):N.filter(n=>!r.x.length||r.x.some(x=>(n.title+' '+n.description+' '+n.source).toLowerCase().includes(x)));A.innerHTML=`<section class="route"><div class="tag">AI NEWS NOW</div><h1>${esc(r.n)}</h1><p>Live stories automatically refreshed from public feeds.</p></section>${L.length?`<section class="grid">${L.map(card).join('')}</section>`:'<div class="empty">No matching stories in the current feed yet.</div>'}`}F.onsubmit=e=>{e.preventDefault();let q=Q.value.trim().toLowerCase();if(!q)return location.href='/all-news/';stop();let L=N.filter(n=>(n.title+' '+n.description+' '+n.source).toLowerCase().includes(q));A.innerHTML=`<section class="route"><div class="tag">SEARCH</div><h1>Results for “${esc(Q.value.trim())}”</h1><p>${L.length} matching stories</p></section>${L.length?`<section class="grid">${L.map(card).join('')}</section>`:'<div class="empty">No matching stories found.</div>'}`};document.addEventListener('keydown',e=>{if(document.querySelector('.hero')&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){if(e.key==='ArrowLeft')show(i-1,1);if(e.key==='ArrowRight')show(i+1,1)}});fetch('/api/news').then(r=>{if(!r.ok)throw Error('News service '+r.status);return r.json()}).then(d=>{N=d.items||[];if(!N.length)throw Error('No stories returned');render()}).catch(e=>A.innerHTML=`<div class="error">Live news could not load: ${esc(e.message)}</div>`);
</script></body></html>
