name: Import current ITCertVault site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current site
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import os
          import re
          import ssl
          import sys
          import urllib.parse
          import urllib.request
          from collections import deque

          SOURCES = [
              'https://it-cert-vault.com/',
              'https://www.it-cert-vault.com/',
              'https://cert-forge-r0v7yrucu-cloud-drive.vercel.app/',
          ]
          REQUIRED = [
              'index.html', 'base.html',
              'itcv-seed-meta-1.js', 'itcv-seed-meta-2.js',
              'itcv-seed-meta-3.js', 'itcv-seed-meta-4.js',
              'itcv-runtime-1.js', 'itcv-runtime-2.js',
              'itcv-runtime-3.js', 'itcv-runtime-4.js',
          ]
          TEXT_EXTS = {'.html', '.htm', '.css', '.js', '.mjs', '.json', '.svg', '.txt', '.xml'}
          UA = 'Mozilla/5.0 ITCertVault GitHub Importer'
          ctx = ssl.create_default_context()

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=90, context=ctx) as r:
                  return r.read(), r.headers.get_content_type()

          base = None
          last_error = None
          for candidate in SOURCES:
              try:
                  data, _ = fetch(urllib.parse.urljoin(candidate, 'index.html'))
                  if b'ITCertVault' in data:
                      base = candidate
                      print('Using source:', base)
                      break
              except Exception as e:
                  last_error = e
                  print('Source unavailable:', candidate, repr(e))
          if not base:
              raise SystemExit(f'Could not reach a current ITCertVault source: {last_error!r}')

          pending = deque(REQUIRED)
          seen = set()

          def safe_local_path(raw):
              raw = html.unescape(raw.strip()).replace('\\/', '/')
              if not raw or raw.startswith(('#', 'data:', 'blob:', 'mailto:', 'tel:', 'javascript:', '//')):
                  return None
              u = urllib.parse.urlsplit(raw)
              if u.scheme or u.netloc:
                  return None
              p = urllib.parse.unquote(u.path).lstrip('/')
              p = os.path.normpath(p).replace('\\', '/')
              if p in ('', '.') or p.startswith('../') or p == '..':
                  return None
              return p

          ATTR_RE = re.compile(r'''(?:src|href)\s*=\s*["']([^"']+)["']''', re.I)
          CSS_RE = re.compile(r'''url\(\s*["']?([^"')]+)''', re.I)
          ASSET_RE = re.compile(r'''(?<![A-Za-z0-9_])((?:assets|images|img|fonts)/[A-Za-z0-9._~!$&'()*+,;=:@%/\-]+)''', re.I)

          while pending:
              path = pending.popleft()
              if path in seen or path.startswith('.github/'):
                  continue
              seen.add(path)
              url = urllib.parse.urljoin(base, path)
              try:
                  data, ctype = fetch(url)
              except Exception as e:
                  if path in REQUIRED:
                      raise SystemExit(f'Required file failed: {path}: {e!r}')
                  print('Skipping unavailable asset:', path, repr(e))
                  continue

              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path, 'wb') as f:
                  f.write(data)
              print(f'Downloaded {path} ({len(data):,} bytes)')

              ext = os.path.splitext(path)[1].lower()
              if ext in TEXT_EXTS or ctype.startswith('text/') or ctype in ('application/javascript','application/json','image/svg+xml'):
                  try:
                      text = data.decode('utf-8', errors='ignore')
                  except Exception:
                      continue
                  refs = []
                  refs.extend(ATTR_RE.findall(text))
                  refs.extend(CSS_RE.findall(text))
                  refs.extend(ASSET_RE.findall(text))
                  for raw in refs:
                      p = safe_local_path(raw)
                      if p and p not in seen:
                          pending.append(p)

          print('Import complete. Files downloaded:', len(seen))
          PY

      - name: Commit imported website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Import current ITCertVault website"
            git push origin main
          fi
